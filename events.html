<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CID Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--y:#FFCD11;--k:#111111}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;color:#fff;font-family:"Barlow","Segoe UI",system-ui,sans-serif}
.wrap{padding:4px 2px 20px}
.top{margin-bottom:18px;animation:rise .6s ease both}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.eyebrow i{width:26px;height:4px;background:var(--y);border-radius:2px}
h1{font-size:34px;font-weight:800;margin:10px 0 4px}
.sub{color:#a8a8a8;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:210px;padding:22px;border-radius:16px;border:1px solid #333;background:#1a1a1a;color:#fff;text-decoration:none;
  transition:transform .25s,box-shadow .25s,border-color .25s;animation:rise .6s ease both;animation-delay:var(--d)}
.card:hover{transform:translateY(-5px);box-shadow:0 16px 32px rgba(0,0,0,.4);border-color:var(--y)}
.card::after{content:"";position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--y);transition:width .35s}
.card:hover::after{width:100%}
.ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--y);color:var(--k);transition:transform .3s}
.card:hover .ico{transform:rotate(-6deg) scale(1.08)}
.card h3{font-size:20px;font-weight:700;margin:16px 0 6px}
.card p{font-size:14px;line-height:1.5;color:#a8a8a8;flex:1}
.go{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:14px;font-weight:700}
.go svg{transition:transform .25s}
.card:hover .go svg{transform:translate(2px,-2px)}
.card.soon{cursor:default;opacity:.5}
.card.soon:hover{transform:none;box-shadow:none;border-color:#333}
.card.soon:hover::after{width:0}.card.soon:hover .ico{transform:none}
.card.soon .ico{background:#2a2a2a;color:#777}.card.soon .go{color:#777}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="eyebrow"><i></i>Events · Арга хэмжээ</div>
    <h1>Event tools</h1>
    <p class="sub">Check guests in, plan the hall and follow arrivals on event day.</p>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
/* ===== Your tools: set link to "" to show Coming soon ===== */
const TOOLS = [
  { title:"QR check-in", desc:"Scan guest QR codes, search guests and add walk-ins.", link:"https://pikalino.github.io/cid-portal/checkin.html", icon:"qr" },
  { title:"Seat planner", desc:"Blueprint hall map with tables, hosts, zones and seats.", link:"https://pikalino.github.io/cid-portal/desks.html", icon:"seat" },
  { title:"Live view", desc:"Live arrivals and seat map for the venue screen.", link:"", icon:"screen" },
  { title:"Past events", desc:"Photos, reports and results from previous events.", link:"", icon:"camera" }
];
/* ========================================================== */
const ICONS={
  qr:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v.01M14 21h7v-4"/>',
  seat:'<circle cx="12" cy="12" r="4"/><circle cx="12" cy="4" r="1.6"/><circle cx="12" cy="20" r="1.6"/><circle cx="4" cy="12" r="1.6"/><circle cx="20" cy="12" r="1.6"/><circle cx="6.3" cy="6.3" r="1.4"/><circle cx="17.7" cy="17.7" r="1.4"/>',
  screen:'<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/><path d="m7 12 3-3 2 2 4-4"/>',
  camera:'<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/>'
};
const ARROW='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("grid").innerHTML=TOOLS.map((t,i)=>{const ok=!!t.link;
  const inner=`<div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">${ICONS[t.icon]}</svg></div>
    <h3>${esc(t.title)}</h3><p>${esc(t.desc)}</p><span class="go">${ok?"Open "+ARROW:"Coming soon"}</span>`;
  return ok?`<a class="card" href="${esc(t.link)}" target="_blank" rel="noopener" style="--d:${.1+i*.08}s">${inner}</a>`
           :`<div class="card soon" style="--d:${.1+i*.08}s">${inner}</div>`}).join("");
</script>
</body>
</html>
