<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CID Dashboards</title>
<style>
:root{--red:#A4262C;--ink:#1b1f24;--dim:#5d6670;--line:#e4e7eb;--navy:#0f2a4a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff;color:var(--ink);font-family:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:8px 4px 24px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px}
h1{font-size:28px;font-weight:600}
.sub{color:var(--dim);font-size:14px;margin-top:4px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{padding:10px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;min-width:220px;outline:none;transition:border-color .2s}
.search:focus{border-color:var(--red)}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer;color:var(--dim);transition:all .2s}
.chip:hover{border-color:var(--red);color:var(--red)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{position:relative;overflow:hidden;display:flex;flex-direction:column;padding:20px;border-radius:16px;border:1px solid var(--line);
  background:#fff;color:inherit;text-decoration:none;transition:transform .25s,box-shadow .25s,border-color .25s;animation:rise .5s ease both}
.card:hover{transform:translateY(-5px);box-shadow:0 14px 30px rgba(15,42,74,.12);border-color:rgba(164,38,44,.35)}
.card::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--red);transition:width .35s}
.card:hover::after{width:100%}
.row{display:flex;align-items:center;justify-content:space-between}
.ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:#fbeced;color:var(--red);transition:transform .3s}
.card:hover .ico{transform:rotate(-6deg) scale(1.08)}
.tag{font-size:12px;padding:3px 10px;border-radius:999px;background:#eef3f9;color:var(--navy)}
.card h3{font-size:16px;font-weight:600;margin:14px 0 6px}
.card p{font-size:13px;line-height:1.5;color:var(--dim);flex:1}
.go{margin-top:12px;font-size:13px;font-weight:600;color:var(--red);display:inline-flex;gap:6px;align-items:center}
.go svg{transition:transform .25s}
.card:hover .go svg{transform:translateX(4px)}
.empty{grid-column:1/-1;text-align:center;color:var(--dim);padding:40px;font-size:14px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>Dashboards</h1><p class="sub">Pick a report to open it.</p></div>
    <div class="tools"><input class="search" id="q" placeholder="Search reports"><div id="chips" class="tools"></div></div>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
/* ===== Your reports: edit this list ===== */
const REPORTS = [
  { title:"S&OP 2027", desc:"Overall 2027 sales and operations plan.", category:"S&OP 2027", link:"https://barloworldmn.sharepoint.com/teams/CISharepoint/SitePages/S&OP-2027-Prime.aspx" },
  { title:"S&OP SEM 2027", desc:"2027 plan for SEM Machines.", category:"S&OP 2027", link:"https://barloworldmn.sharepoint.com/teams/CISharepoint/SitePages/S&OP-2027-SEM.aspx" },
  { title:"S&OP E&T 2027", desc:"2027 plan for Energy & Transportation.", category:"S&OP 2027", link:"https://barloworldmn.sharepoint.com/teams/CISharepoint/SitePages/S&OP-2027-E&T.aspx" },
  { title:"S&OP Tyre 2027", desc:"2027 plan for tyres.", category:"S&OP 2027", link:"https://barloworldmn.sharepoint.com/teams/CISharepoint/SitePages/S&OP-2027-Tyre.aspx" },
  { title:"S&OP Used 2027", desc:"2027 plan for used equipment.", category:"S&OP 2027", link:"https://barloworldmn.sharepoint.com/teams/CISharepoint/SitePages/S&OP-2027-Used.aspx" },
  { title:"Lead to Opportunity", desc:"Lead conversion and how leads move into the pipeline.", category:"Telemarketing", link:"https://barloworldmn.sharepoint.com/teams/CISharepoint/SitePages/Lead-to-opp.aspx" },
  { title:"Telemarketer Marketing Journey", desc:"Telemarketing calls and campaign results.", category:"Telemarketing", link:"https://barloworldmn.sharepoint.com/teams/CISharepoint/SitePages/Marketing-Journey.aspx" }
];
/* ======================================== */
const ICON='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>';
const ARROW='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
let cat="All";
const cats=["All",...new Set(REPORTS.map(r=>r.category))];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function chips(){document.getElementById("chips").innerHTML=cats.map(c=>`<button class="chip${c===cat?" on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{cat=b.dataset.c;chips();draw()})}
function draw(){const q=document.getElementById("q").value.trim().toLowerCase();
  const list=REPORTS.filter(r=>(cat==="All"||r.category===cat)&&(r.title+" "+r.desc).toLowerCase().includes(q));
  document.getElementById("grid").innerHTML=list.length?list.map((r,i)=>`
    <a class="card" href="${esc(r.link)}" target="_top" style="animation-delay:${i*60}ms">
      <div class="row"><div class="ico">${ICON}</div><span class="tag">${esc(r.category)}</span></div>
      <h3>${esc(r.title)}</h3><p>${esc(r.desc)}</p><span class="go">Open report ${ARROW}</span>
    </a>`).join(""):`<div class="empty">No reports match your search.</div>`}
document.getElementById("q").addEventListener("input",draw);
chips();draw();
</script>
</body>
</html>
