<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CID Seat Planner</title>
<style>
:root{--bg:#0b1e35;--panel:#10263f;--line:#24405f;--ink:#e8eef5;--dim:#8aa0b8;--blue:#4a90d9;--amber:#e0a526;--green:#4aa564;--purple:#8f86e8;--red:#e35d5d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;font-size:14px}
body{display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0 10px 7px 0;font-weight:600}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--dim)}
input,select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:13px;font-family:inherit}
input[type=number]{width:70px}
button{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px;cursor:pointer;font-family:inherit}
button:hover{border-color:var(--blue)}
button.pri{background:var(--amber);border-color:var(--amber);color:#1a1408;font-weight:600}
#msg{font-size:12px;color:var(--amber);align-self:center;min-width:120px}
.wrap{flex:1;display:flex;min-height:0}
#map{flex:1;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
aside{width:340px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.stat{background:var(--bg);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:18px;font-weight:600}.stat span{font-size:11px;color:var(--dim)}
#warn{grid-column:1/-1;font-size:12px;color:var(--amber)}
#panel{flex:1;overflow-y:auto;padding:12px}
h2{font-size:15px;margin:0 0 10px;font-weight:600}
.row{display:flex;align-items:center;gap:8px;padding:7px 6px;border-bottom:1px solid var(--line);font-size:13px}
.dot{width:11px;height:11px;border-radius:50%;flex:none;border:1.5px solid var(--blue)}
.nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--dim);font-size:11px}
.x{border:none;padding:2px 6px;color:var(--dim)}
.g{cursor:pointer;border-radius:8px}.g:hover{background:var(--bg)}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:#16301e;color:#8fe0a6}
.it{cursor:move}
.it.sel .sh{stroke:var(--amber);stroke-width:2.5}
.ch{animation:pop .35s cubic-bezier(.2,1.4,.4,1) both;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{transform:scale(0)}}
@media (max-width:820px){.wrap{flex-direction:column}aside{width:100%;height:45%;border-left:none;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1>Seat planner</h1>
  <label class="f">Width (m)<input id="iW" type="number" min="10" max="200" step="1"></label>
  <label class="f">Length (m)<input id="iL" type="number" min="10" max="200" step="1"></label>
  <label class="f">Guests<input id="iN" type="number" min="1" max="3000" step="1" value="100"></label>
  <label class="f">Table<select id="iS"><option value="round">Round</option><option value="square">Square</option></select></label>
  <label class="f">Chairs<select id="iC"><option>6</option><option selected>8</option><option>10</option><option>12</option></select></label>
  <button class="pri" id="bGen">Generate</button>
  <button id="bT">+ Table</button>
  <button id="bZ">+ Zone</button>
  <button id="bAuto">Auto-seat by company</button>
  <button id="bClear">Clear guests</button>
  <span id="msg"></span>
  <span style="flex:1"></span>
  <button id="bZo" title="Zoom out">−</button>
  <button id="bZi" title="Zoom in">+</button>
  <button id="bFit">Fit</button>
  <button id="bExp">Export</button>
  <button id="bImp">Import</button>
  <input id="fImp" type="file" accept=".json" hidden>
</header>
<div class="wrap">
  <svg id="map">
    <defs>
      <pattern id="m1" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0H0V1" fill="none" stroke="#4a90d9" stroke-opacity=".14" stroke-width=".03"/></pattern>
      <pattern id="m5" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="url(#m1)"/><path d="M5 0H0V5" fill="none" stroke="#4a90d9" stroke-opacity=".32" stroke-width=".06"/></pattern>
    </defs>
    <g id="hall"></g><g id="items"></g>
  </svg>
  <aside>
    <div class="stats" id="stats"></div>
    <div id="panel"></div>
  </aside>
</div>
<script>
/* ===== Sample data (replaced by Dataverse in Phase 4) ===== */
const FIRST=["Bat-Erdene","Oyunchimeg","Ganbold","Tuvshin","Sarnai","Dorj","Nomin","Altangerel","Enkhjin","Munkh","Khulan","Uyanga","Temuulen","Saruul","Bolor","Jargal"];
const COMP=["Erdenes Tavan Tolgoi","MAK","Oyu Tolgoi","Energy Resources","Khishig Uul","Monpolymet","Bodi Group","Tavan Bogd","MCS Group","Newcom"];
const ATT=Array.from({length:120},(_,i)=>({id:"a"+(i+1),name:FIRST[i%16]+" "+String.fromCharCode(65+(i*7)%26)+".",company:COMP[(i*3)%10],arrived:i%4===0}));
const EMP=[{id:"u1",name:"J. Jargal"},{id:"u2",name:"B. Bolor"},{id:"u3",name:"T. Temuulen"},{id:"u4",name:"S. Saruul"},{id:"u5",name:"A. Anu"},{id:"u6",name:"G. Gerel"},{id:"u7",name:"N. Naran"},{id:"u8",name:"O. Od"}];
const ROLES=["Sales rep","Director","Other"];
/* ========================================================== */

const KEY="cid-desks-v1", NS="http://www.w3.org/2000/svg";
const $=id=>document.getElementById(id);
const svg=$("map"), HG=$("hall"), IG=$("items");
const attById=Object.fromEntries(ATT.map(a=>[a.id,a]));
const empById=Object.fromEntries(EMP.map(u=>[u.id,u]));
let S=load()||{W:40,L:28,items:[],nid:1};
let sel=null, vb={x:0,y:0,w:40,h:28}, drag=null, pan=null, msgT=null;

function load(){try{const o=JSON.parse(localStorage.getItem(KEY));return o&&Array.isArray(o.items)?o:null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function flash(t){$("msg").textContent=t;clearTimeout(msgT);msgT=setTimeout(()=>$("msg").textContent="",3500)}
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function tx(p,x,y,s,fs,fill,anchor){const t=el("text",{x,y,"font-size":fs,fill:fill||"#e8eef5","text-anchor":anchor||"middle","pointer-events":"none","font-family":"Segoe UI,sans-serif"},p);t.textContent=s;return t}
function tables(){return S.items.filter(i=>i.k==="t")}
function find(id){return S.items.find(i=>i.id===id)}
function seated(){const s=new Set();tables().forEach(t=>t.seats.forEach((x,i)=>{if(i>0&&x)s.add(x.a)}));return s}
function pool(){const s=seated();return ATT.filter(a=>!s.has(a.id))}
function nextNum(){return tables().reduce((m,t)=>Math.max(m,t.num),0)+1}
function ring(t){return Math.max(1.3,t.chairs*.17)}

function mkTable(x,y,shape,chairs,num){return{k:"t",id:S.nid++,num,shape,chairs,x,y,seats:Array(chairs).fill(null)}}
function mkZone(label,x,y,w,h,kind){return{k:"z",id:S.nid++,label,x,y,w,h,kind}}

function generate(){
  const W=+$("iW").value,L=+$("iL").value,N=+$("iN").value,shape=$("iS").value,ch=+$("iC").value;
  if(!(W>=10&&W<=200&&L>=10&&L<=200)){flash("Width and length must be 10–200 m");return}
  if(!(N>=1&&N<=3000)){flash("Guests must be 1–3000");return}
  if(S.items.length&&!confirm("Replace the current layout?"))return;
  S={W,L,items:[],nid:1};
  const sh=Math.min(5,L*.15), bw=Math.min(6,W*.14);
  S.items.push(mkZone("Stage · Тайз",W*.3,1,W*.4,sh,"stage"),mkZone("LED",W*.3-2.2,1.5,1.4,sh*.7,"display"),mkZone("LED",W*.7+.8,1.5,1.4,sh*.7,"display"),
    mkZone("Registration · Бүртгэл",1,L-4.5,Math.min(8,W*.2),3.5,"area"),mkZone("Buffet",W-bw-1,L*.3,bw,L*.35,"area"));
  const r=Math.max(1.3,ch*.17), pitch=2*r+1.4, need=Math.ceil(N/(ch-1));
  let made=0,num=1;
  for(let y=sh+3+r;y<=L-2-r&&made<need;y+=pitch)for(let x=2+r;x<=W-bw-2-r&&made<need;x+=pitch){S.items.push(mkTable(+x.toFixed(1),+y.toFixed(1),shape,ch,num++));made++}
  sel=null;fit();refresh();
  flash(made<need?`Hall fits ${made} tables (${made*(ch-1)} guests). Make it bigger for ${N}.`:`${made} tables placed`);
}

function chairPos(t,i){const n=t.chairs,r=ring(t);
  if(t.shape==="round"){const a=-Math.PI/2+i*2*Math.PI/n;return[Math.cos(a)*r,Math.sin(a)*r]}
  const per=Math.ceil(n/4),side=Math.floor(i/per),k=i%per,o=(k-(per-1)/2)*.75;return[[o,-r],[r,o],[-o,r],[-r,-o]][side]}
function chairCol(t,i){const s=t.seats[i];
  if(i===0)return s?["#8f86e8","#5d54c4"]:["none","#8f86e8"];
  if(!s)return["none","#4a90d9"];const a=attById[s.a];return a&&a.arrived?["#4aa564","#2f7a45"]:["#e0a526","#a8780f"]}

function drawHall(){HG.innerHTML="";const fs=Math.max(.5,Math.min(S.W,S.L)/45);
  el("rect",{x:0,y:0,width:S.W,height:S.L,fill:"url(#m5)"},HG);
  el("rect",{x:0,y:0,width:S.W,height:S.L,fill:"none",stroke:"#4a90d9","stroke-width":2,"stroke-dasharray":"8 5","vector-effect":"non-scaling-stroke"},HG);
  tx(HG,S.W/2,-.7,S.W+" m",fs,"#8aa0b8");
  const t=tx(HG,-.7,S.L/2,S.L+" m",fs,"#8aa0b8");t.setAttribute("transform",`rotate(-90 -.7 ${S.L/2})`);
  el("line",{x1:S.W/2-2,y1:S.L,x2:S.W/2+2,y2:S.L,stroke:"#4aa564","stroke-width":.4},HG);
  tx(HG,S.W/2,S.L-.7,"Entrance · Орц",fs*.9,"#7fd197");}

function drawItems(){IG.innerHTML="";
  S.items.forEach((it,idx)=>{const g=el("g",{class:"it"+(it.id===sel?" sel":""),transform:`translate(${it.x},${it.y})`,"data-id":it.id},IG);
    if(it.k==="z"){const c={stage:["#4a90d9",.28,"none"],display:["#e0a526",.2,"none"],area:["#4a90d9",.06,"4 3"]}[it.kind]||["#4a90d9",.06,"4 3"];
      el("rect",{class:"sh",width:it.w,height:it.h,rx:.3,fill:c[0],"fill-opacity":c[1],stroke:c[0],"stroke-width":1.2,"stroke-dasharray":c[2],"vector-effect":"non-scaling-stroke"},g);
      const fs=Math.max(.35,Math.min(1,it.h*.35,it.w/Math.max(4,it.label.length)*1.7));tx(g,it.w/2,it.h/2+fs*.35,it.label,fs);}
    else{it.seats.forEach((s,i)=>{const[cx,cy]=chairPos(it,i),[f,st]=chairCol(it,i);
        el("circle",{class:"ch",cx,cy,r:.3,fill:f,stroke:st,"stroke-width":1.4,"vector-effect":"non-scaling-stroke",style:`animation-delay:${Math.min(idx*6+i*18,500)}ms`},g)});
      const tr=ring(it)-.45;
      const sh=it.shape==="round"?el("circle",{class:"sh",r:tr},g):el("rect",{class:"sh",x:-tr,y:-tr,width:2*tr,height:2*tr,rx:.15},g);
      [["fill","#4a90d9"],["fill-opacity",.16],["stroke","#4a90d9"],["stroke-width",1.2],["vector-effect","non-scaling-stroke"]].forEach(([k,v])=>sh.setAttribute(k,v));
      tx(g,0,.28,String(it.num),.8);}
    g.addEventListener("pointerdown",e=>startDrag(e,it));});}

function stats(){const T=tables();let cap=0,seat=0,arr=0,nohost=0;
  T.forEach(t=>{cap+=t.chairs-1;if(!t.seats[0])nohost++;t.seats.forEach((s,i)=>{if(i>0&&s){seat++;if(attById[s.a]&&attById[s.a].arrived)arr++}})});
  $("stats").innerHTML=`<div class="stat"><b>${T.length}</b><span>Tables</span></div><div class="stat"><b>${seat} / ${cap}</b><span>Seated / capacity</span></div>
  <div class="stat"><b>${ATT.length-seat}</b><span>Unseated guests</span></div><div class="stat"><b>${arr}</b><span>Arrived</span></div>
  ${nohost?`<div id="warn">${nohost} table${nohost>1?"s":""} without a host</div>`:""}`;}

function panel(){const P=$("panel"),it=sel!=null?find(sel):null;
  if(!it){P.innerHTML=`<h2>Unseated guests</h2><input id="gq" placeholder="Search name or company" style="width:100%;margin-bottom:8px"><div id="gl"></div>
    <p class="sub" style="margin-top:12px;line-height:1.5">Click a table to seat guests. Drag tables and zones to move them. Scroll to zoom, drag empty space to pan.</p>`;guestList(null);return}
  if(it.k==="z"){P.innerHTML=`<h2>Zone</h2>
    <label class="f" style="margin-bottom:8px">Name<input id="zl" value="${esc(it.label)}"></label>
    <div style="display:flex;gap:8px;margin-bottom:8px"><label class="f">Width (m)<input id="zw" type="number" min="1" max="200" step="0.5" value="${it.w}"></label>
    <label class="f">Depth (m)<input id="zh" type="number" min="1" max="200" step="0.5" value="${it.h}"></label></div>
    <label class="f" style="margin-bottom:12px">Type<select id="zk"><option value="stage">Stage / main</option><option value="display">Display / screen</option><option value="area">Area</option></select></label>
    <button id="zdel">Remove zone</button>`;
    $("zk").value=it.kind;
    $("zl").oninput=e=>{it.label=e.target.value;drawItems();save()};
    $("zw").onchange=e=>{it.w=Math.max(1,+e.target.value||1);refresh()};
    $("zh").onchange=e=>{it.h=Math.max(1,+e.target.value||1);refresh()};
    $("zk").onchange=e=>{it.kind=e.target.value;refresh()};
    $("zdel").onclick=()=>{S.items=S.items.filter(x=>x!==it);sel=null;refresh()};return}
  const h=it.seats[0];
  P.innerHTML=`<div style="display:flex;gap:6px;align-items:center;margin-bottom:10px"><h2 style="margin:0;flex:1">Table ${it.num}</h2>
    <select id="tsh"><option value="round">Round</option><option value="square">Square</option></select>
    <select id="tch">${[4,6,8,10,12].map(n=>`<option value="${n}">${n} chairs</option>`).join("")}</select>
    <button class="x" id="tdel" title="Remove table">✕</button></div>
    <div class="row"><span class="dot" style="background:${h?"#8f86e8":"transparent"};border-color:#8f86e8"></span><span class="sub" style="width:44px">Seat 1</span>
    <select id="hEmp" style="flex:1;min-width:0"><option value="">Choose host</option>${EMP.map(u=>`<option value="${u.id}"${h&&h.u===u.id?" selected":""}>${esc(u.name)}</option>`).join("")}</select>
    <select id="hRole">${ROLES.map(r=>`<option${h&&h.role===r?" selected":""}>${r}</option>`).join("")}</select></div>
    <div id="seats"></div>
    <h2 style="margin-top:16px">Add guests</h2><input id="gq" placeholder="Search name or company" style="width:100%;margin-bottom:8px"><div id="gl"></div>`;
  $("tsh").value=it.shape;$("tch").value=it.chairs;
  $("seats").innerHTML=it.seats.map((s,i)=>{if(i===0)return"";const a=s&&attById[s.a];
    return`<div class="row"><span class="dot" style="background:${a?(a.arrived?"#4aa564":"#e0a526"):"transparent"};border-color:${a?(a.arrived?"#2f7a45":"#a8780f"):"#4a90d9"}"></span>
    <span class="sub" style="width:44px">Seat ${i+1}</span><span class="nm">${a?esc(a.name)+` <span class="sub">${esc(a.company)}</span>`:'<span class="sub">Empty</span>'}</span>
    ${a&&a.arrived?'<span class="tag">Arrived</span>':""}${a?`<button class="x" data-i="${i}" title="Remove">✕</button>`:""}</div>`}).join("");
  $("seats").querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{it.seats[+b.dataset.i]=null;refresh()});
  $("hEmp").onchange=e=>{it.seats[0]=e.target.value?{u:e.target.value,role:$("hRole").value}:null;refresh()};
  $("hRole").onchange=e=>{if(it.seats[0]){it.seats[0].role=e.target.value;save()}};
  $("tsh").onchange=e=>{it.shape=e.target.value;refresh()};
  $("tch").onchange=e=>{const n=+e.target.value;it.chairs=n;it.seats=Array.from({length:n},(_,i)=>it.seats[i]||null);refresh()};
  $("tdel").onclick=()=>{S.items=S.items.filter(x=>x!==it);sel=null;refresh()};
  guestList(it);}

function guestList(t){const q=$("gq"),box=$("gl");
  const run=()=>{const s=q.value.trim().toLowerCase();
    const list=pool().filter(a=>!s||(a.name+" "+a.company).toLowerCase().includes(s)).slice(0,80);
    box.innerHTML=list.length?list.map(a=>`<div class="row g" data-a="${a.id}"><span class="nm">${esc(a.name)}<br><span class="sub">${esc(a.company)}</span></span>${a.arrived?'<span class="tag">Arrived</span>':""}</div>`).join("")
      :'<p class="sub">No unseated guests match.</p>';
    box.querySelectorAll("[data-a]").forEach(r=>r.onclick=()=>{
      if(!t){flash("Select a table first");return}
      const i=t.seats.findIndex((x,k)=>k>0&&!x);
      if(i<0){flash(`Table ${t.num} is full`);return}
      t.seats[i]={a:r.dataset.a};const keep=q.value;refresh();const nq=$("gq");if(nq){nq.value=keep;nq.dispatchEvent(new Event("input"))}});};
  q.addEventListener("input",run);run();}

function refresh(){drawHall();drawItems();stats();panel();save()}

function setVB(){svg.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`)}
function fit(){const r=(svg.clientWidth/svg.clientHeight)||1.6,pad=Math.max(S.W,S.L)*.06,w=S.W+pad*2,h=S.L+pad*2;
  vb=w/h>r?{x:-pad,y:-pad-(w/r-h)/2,w,h:w/r}:{x:-pad-(h*r-w)/2,y:-pad,w:h*r,h};setVB()}
function zoomAt(px,py,f){vb.x=px-(px-vb.x)*f;vb.y=py-(py-vb.y)*f;vb.w*=f;vb.h*=f;setVB()}
function pt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}

function startDrag(e,it){e.stopPropagation();const p=pt(e);drag={it,dx:p.x-it.x,dy:p.y-it.y,moved:false};
  if(sel!==it.id){sel=it.id;drawItems();panel()}svg.setPointerCapture(e.pointerId)}
svg.addEventListener("pointerdown",e=>{if(drag)return;pan={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y,moved:false};svg.setPointerCapture(e.pointerId)});
svg.addEventListener("pointermove",e=>{
  if(drag){const p=pt(e),it=drag.it;it.x=Math.round((p.x-drag.dx)*2)/2;it.y=Math.round((p.y-drag.dy)*2)/2;drag.moved=true;
    const g=IG.querySelector(`[data-id="${it.id}"]`);if(g)g.setAttribute("transform",`translate(${it.x},${it.y})`)}
  else if(pan){const s=vb.w/svg.clientWidth,dx=e.clientX-pan.x,dy=e.clientY-pan.y;if(Math.abs(dx)+Math.abs(dy)>3)pan.moved=true;
    vb.x=pan.vx-dx*s;vb.y=pan.vy-dy*s;setVB()}});
svg.addEventListener("pointerup",()=>{if(drag&&drag.moved)save();if(pan&&!pan.moved&&sel!=null){sel=null;drawItems();panel()}drag=null;pan=null});
svg.addEventListener("wheel",e=>{e.preventDefault();const p=pt(e);zoomAt(p.x,p.y,e.deltaY>0?1.12:.89)},{passive:false});

$("bGen").onclick=generate;
$("bT").onclick=()=>{const t=mkTable(+(vb.x+vb.w/2).toFixed(1),+(vb.y+vb.h/2).toFixed(1),$("iS").value,+$("iC").value,nextNum());S.items.push(t);sel=t.id;refresh()};
$("bZ").onclick=()=>{const z=mkZone("New zone",+(vb.x+vb.w/2-3).toFixed(1),+(vb.y+vb.h/2-2).toFixed(1),6,4,"area");S.items.push(z);sel=z.id;refresh()};
$("bAuto").onclick=()=>{const p=pool().sort((a,b)=>a.company.localeCompare(b.company));let k=0;
  tables().sort((a,b)=>a.num-b.num).forEach(t=>{for(let i=1;i<t.chairs;i++)if(!t.seats[i]&&k<p.length)t.seats[i]={a:p[k++].id}});
  refresh();flash(k?`Seated ${k} guests`:"No empty seats or no unseated guests")};
$("bClear").onclick=()=>{if(!confirm("Remove all guests from tables? Hosts stay."))return;tables().forEach(t=>t.seats=t.seats.map((s,i)=>i===0?s:null));refresh()};
$("bZi").onclick=()=>zoomAt(vb.x+vb.w/2,vb.y+vb.h/2,.8);
$("bZo").onclick=()=>zoomAt(vb.x+vb.w/2,vb.y+vb.h/2,1.25);
$("bFit").onclick=fit;
$("bExp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download="cid-layout.json";a.click()};
$("bImp").onclick=()=>$("fImp").click();
$("fImp").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.items))throw 0;S=o;sel=null;fit();refresh();flash("Layout imported")}catch(x){flash("That file isn't a valid layout")}};r.readAsText(f);e.target.value=""};
window.addEventListener("resize",fit);

$("iW").value=S.W;$("iL").value=S.L;
if(!S.items.length){S.items=[];generate()}else{fit();refresh()}
</script>
</body>
</html>
