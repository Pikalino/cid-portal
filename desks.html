<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CID Seat Planner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<style>
:root{--bg:#0b1e35;--panel:#10263f;--line:#24405f;--ink:#e8eef5;--dim:#8aa0b8;--blue:#4a90d9;--amber:#e0a526;--green:#4aa564;--purple:#8f86e8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;font-size:14px}
body{display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0 10px 7px 0;font-weight:600}
.bar2{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;width:100%}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--dim)}
input,select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:13px;font-family:inherit}
input[type=number]{width:70px}
button{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px;cursor:pointer;font-family:inherit}
button:hover{border-color:var(--blue)}
button:disabled{opacity:.5;cursor:default}
button.pri{background:var(--amber);border-color:var(--amber);color:#1a1408;font-weight:600}
button.on{background:var(--blue);border-color:var(--blue)}
#msg{font-size:12px;color:var(--amber);align-self:center;min-width:120px}
#dirty{font-size:12px;align-self:center;color:var(--dim)}
#dirty.un{color:var(--amber)}
#who{font-size:12px;color:var(--dim);align-self:center}
.wrap{flex:1;display:flex;min-height:0}
#map{flex:1;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
aside{width:350px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.stat{background:var(--bg);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:18px;font-weight:600}.stat span{font-size:11px;color:var(--dim)}
.note{grid-column:1/-1;font-size:12px;color:var(--amber)}
#panel{flex:1;overflow-y:auto;padding:12px}
h2{font-size:15px;margin:0 0 10px;font-weight:600}
.row{display:flex;align-items:center;gap:8px;padding:7px 6px;border-bottom:1px solid var(--line);font-size:13px}
.dot{width:11px;height:11px;border-radius:50%;flex:none;border:1.5px solid var(--blue)}
.nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--dim);font-size:11px}
.x{border:none;padding:2px 6px;color:var(--dim)}
.g{cursor:pointer;border-radius:8px}.g:hover{background:var(--bg)}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:#16301e;color:#8fe0a6}
.chip{display:inline-flex;align-items:center;gap:4px;background:#2a2560;color:#cfcaff;border-radius:999px;padding:3px 4px 3px 10px;font-size:12px;margin:0 6px 6px 0}
.chip button{border:none;padding:0 6px;color:#cfcaff}
.it{cursor:move}
.it.sel .sh{stroke:var(--amber);stroke-width:2.5}
.ch{animation:pop .35s cubic-bezier(.2,1.4,.4,1) both;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{transform:scale(0)}}
#gate{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#gate h2{font-size:22px;margin:0}
#gate p{color:var(--dim);max-width:380px;line-height:1.5;margin:0}
#gateMsg{color:var(--amber);max-width:380px;line-height:1.5;font-size:13px}
@media (max-width:820px){.wrap{flex-direction:column}aside{width:100%;height:45%;border-left:none;border-top:1px solid var(--line)}}
#v3d{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#0b0b0b;display:none}
#v3d canvas{display:block}
#v3dbar{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
#v3dbar button{background:rgba(17,17,17,.85)}
#v3dtip{position:absolute;display:none;pointer-events:none;background:#111;border:1px solid #FFCD11;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;z-index:3;max-width:240px}
#v3dhelp{position:absolute;bottom:12px;left:12px;font-size:12px;color:#8aa0b8;z-index:2}
</style>
</head>
<body>
<div id="gate">
  <h2>Seat planner</h2>
  <p>Sign in with your Barloworld Microsoft account to load attendees and layouts.</p>
  <button class="pri" id="signIn">Sign in with Microsoft</button>
  <div id="gateMsg"></div>
</div>
<header>
  <h1>Seat planner</h1>
  <label class="f">Layout<select id="lsel"></select></label>
  <label class="f">Layout name<input id="lname" placeholder="e.g. Customer Day 2027" style="width:200px"></label>
  <button class="pri" id="bSave">Save</button>
  <span id="dirty"></span>
  <span style="flex:1"></span>
  <span id="who"></span>
  <button id="signOut">Sign out</button>
  <div class="bar2">
    <label class="f">Width (m)<input id="iW" type="number" min="10" max="300" step="1" value="40"></label>
    <label class="f">Length (m)<input id="iL" type="number" min="10" max="300" step="1" value="28"></label>
    <label class="f">Guests<input id="iN" type="number" min="1" max="3000" step="1" value="100"></label>
    <label class="f">Table<select id="iS"><option value="round">Round</option><option value="square">Square</option><option value="oval">Oval</option><option value="long">Long</option></select></label>
    <label class="f">Chairs<input id="iC" type="number" min="1" max="40" step="1" value="8"></label>
    <button id="bGen">Generate</button>
    <button id="bHall">Hall shape</button>
    <button id="bT">+ Table</button>
    <button id="bZ">+ Zone</button>
    <button id="bAuto">Auto-seat by company</button>
    <button id="bClear">Clear guests</button>
    <span id="msg"></span>
    <span style="flex:1"></span>
    <button id="bZo" title="Zoom out">−</button>
    <button id="bZi" title="Zoom in">+</button>
    <button id="bFit">Fit</button>
    <button id="b3d">3D view</button>
    <button id="bExp">Export</button>
    <button id="bImp">Import</button>
    <input id="fImp" type="file" accept=".json" hidden>
  </div>
</header>
<div class="wrap">
  <svg id="map">
    <defs>
      <pattern id="m1" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0H0V1" fill="none" stroke="#4a90d9" stroke-opacity=".14" stroke-width=".03"/></pattern>
      <pattern id="m5" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="url(#m1)"/><path d="M5 0H0V5" fill="none" stroke="#4a90d9" stroke-opacity=".32" stroke-width=".06"/></pattern>
    </defs>
    <g id="hall"></g><g id="items"></g><g id="hdl"></g>
  </svg>
  <aside>
    <div class="stats" id="stats"></div>
    <div id="panel"></div>
  </aside>
</div>
<div id="v3d">
  <div id="v3dbar">
    <button data-cam="top">Top</button>
    <button data-cam="iso">Isometric</button>
    <button data-cam="stage">From stage</button>
    <button data-cam="entrance">From entrance</button>
    <button id="v3dclose" class="pri">Back to 2D</button>
  </div>
  <div id="v3dtip"></div>
  <div id="v3dhelp">Drag to rotate · Right-drag to pan · Scroll to zoom · Click a chair for details</div>
</div>
<script>
/* ===================== YOUR SETTINGS ===================== */
const CLIENT_ID = "5dfaa00c-35a4-468d-b9aa-c4d908fd0c8c";
const TENANT_ID = "ae7e4397-7c08-41d5-b3a0-c86741c188cf";
const FLOW_URL  = "https://f0e3c06ec378e576bef89b03e45d43.81.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/07/workflows/8065fdcf32d5444f88a7d777bcf95399/triggers/manual/paths/invoke?api-version=1";
const SCOPE     = "https://service.flow.microsoft.com//.default";
/* ========================================================= */
const ROLES=["Sales rep","Director","Other"];
const NS="http://www.w3.org/2000/svg";
const $=id=>document.getElementById(id);
const svg=$("map"), HG=$("hall"), IG=$("items"), HD=$("hdl");
const KINDS={stage:["Stage / main","#4a90d9",.28,"none"],display:["Display / screen","#e0a526",.2,"none"],area:["Area","#4a90d9",.06,"4 3"],entrance:["Entrance / exit","#4aa564",.3,"none"]};
const rectPts=(W,L)=>[[0,0],[W,0],[W,L],[0,L]];
const lPts=(W,L)=>[[0,0],[+(W*.6).toFixed(1),0],[+(W*.6).toFixed(1),+(L*.45).toFixed(1)],[W,+(L*.45).toFixed(1)],[W,L],[0,L]];
let ATT=[], EMP=[], attById={}, empById={}, LAYOUTS=[], layoutId="", baseline=new Map(), dirty=false;
let S={hall:{preset:"rect",type:"poly",W:40,L:28,pts:rectPts(40,28)},items:[],nid:1};
let sel=null, vtx=-1, vb={x:0,y:0,w:40,h:28}, drag=null, pan=null, msgT=null, account=null;

/* ---------- sign-in ---------- */
const msalApp=new msal.PublicClientApplication({auth:{clientId:CLIENT_ID,authority:"https://login.microsoftonline.com/"+TENANT_ID,redirectUri:location.origin+location.pathname},cache:{cacheLocation:"sessionStorage"}});
function gateMsg(t){$("gateMsg").textContent=t}
async function initAuth(){
  try{const r=await msalApp.handleRedirectPromise();if(r&&r.account)account=r.account}catch(e){gateMsg("Sign-in failed: "+(e.errorMessage||e.message||e))}
  if(!account){const a=msalApp.getAllAccounts();if(a.length)account=a[0]}
  if(!account)return;
  msalApp.setActiveAccount(account);$("who").textContent=account.name||account.username;
  gateMsg("Loading attendees and layouts…");
  try{await loadData();$("gate").style.display="none"}
  catch(e){gateMsg(e.noAccess?"You're signed in, but not on the allowed list for the seat planner. Ask the CRM admin to add you.":"Couldn't load data: "+e.message+". Check that the Desk Management flow is turned on.")}}
$("signIn").onclick=()=>msalApp.loginRedirect({scopes:[SCOPE]}).catch(e=>gateMsg("Sign-in failed: "+(e.errorMessage||e.message)));
$("signOut").onclick=()=>{if(dirty&&!confirm("You have unsaved changes. Sign out anyway?"))return;dirty=false;msalApp.logoutRedirect({account,postLogoutRedirectUri:location.origin+location.pathname})};
async function getToken(){
  try{return(await msalApp.acquireTokenSilent({scopes:[SCOPE],account})).accessToken}
  catch(e){if(e instanceof msal.InteractionRequiredAuthError||(e.errorCode||"").includes("interaction"))await msalApp.acquireTokenRedirect({scopes:[SCOPE],account});throw e}}
async function callFlow(body){
  const res=await fetch(FLOW_URL,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+await getToken()},body:JSON.stringify(body)});
  if(res.status===401||res.status===403){const e=new Error("No access");e.noAccess=true;throw e}
  const j=await res.json().catch(()=>({}));
  if(!res.ok||j.status==="error")throw new Error(j.message||("Error "+res.status));
  return j}

/* ---------- data ---------- */
async function loadData(){
  const d=await callFlow({action:"load"});
  ATT=(d.attendees||[]).map(a=>({id:a.id,name:a.name||"(no name)",company:a.company||"",arrived:!!a.arrived,desk:a.desk==null?null:+a.desk,seat:a.seat==null?null:+a.seat}));
  EMP=(d.employees||[]).map(u=>({id:u.id,name:u.name||"(no name)"}));
  LAYOUTS=d.layouts||[];
  attById=Object.fromEntries(ATT.map(a=>[a.id,a]));empById=Object.fromEntries(EMP.map(u=>[u.id,u]));
  baseline=new Map(ATT.map(a=>[a.id,(a.desk||"")+"|"+(a.seat||"")]));
  fillLayouts();
  if(LAYOUTS.length)openLayout(LAYOUTS[0].id);else newLayout()}
function fillLayouts(){$("lsel").innerHTML=`<option value="__new">+ New layout</option>`+LAYOUTS.map(l=>`<option value="${esc(l.id)}">${esc(l.name||"(unnamed)")}</option>`).join("");$("lsel").value=layoutId||"__new"}
function applySeats(){let lost=0;
  tables().forEach(t=>t.seats=t.seats.map((s,i)=>i===0?s:null));
  ATT.forEach(a=>{if(!a.desk||!a.seat)return;const t=tables().find(t=>t.num===a.desk);
    if(t&&a.seat>=2&&a.seat<=t.chairs&&!t.seats[a.seat-1])t.seats[a.seat-1]={a:a.id};else lost++});
  return lost}
function openLayout(id){const L=LAYOUTS.find(x=>x.id===id);if(!L)return;let o=null;try{o=JSON.parse(L.data)}catch(e){}
  if(!o||!o.hall||!Array.isArray(o.items)){flash("This saved layout couldn't be read");return}
  S=o;layoutId=id;$("lname").value=L.name||"";$("lsel").value=id;$("iW").value=S.hall.W||40;$("iL").value=S.hall.L||28;$("iN").value=ATT.length||100;
  const lost=applySeats();sel=null;vtx=-1;fit();refresh();dirty=lost>0;setDirty();
  if(lost)flash(`${lost} guests had seats that no longer exist. Saving will clear them.`)}
function newLayout(){layoutId="";$("lname").value="";$("lsel").value="__new";$("iN").value=ATT.length||100;
  S={hall:{preset:"rect",type:"poly",W:+$("iW").value||40,L:+$("iL").value||28,pts:rectPts(+$("iW").value||40,+$("iL").value||28)},items:[],nid:1};
  sel=null;vtx=-1;generate()}
function layoutForSave(){const c=JSON.parse(JSON.stringify(S));c.items.forEach(i=>{if(i.k==="t")i.seats=i.seats.map((s,k)=>k===0?s:null)});return c}
function currentSeats(){const m=new Map(ATT.map(a=>[a.id,"|"]));tables().forEach(t=>t.seats.forEach((s,i)=>{if(i>0&&s)m.set(s.a,t.num+"|"+(i+1))}));return m}
async function saveAll(){
  const name=$("lname").value.trim();if(!name){flash("Give the layout a name first");$("lname").focus();return}
  const b=hb();$("bSave").disabled=true;$("bSave").textContent="Saving…";
  try{
    const r=await callFlow({action:"saveLayout",layoutId:layoutId||"",name,data:JSON.stringify(layoutForSave()),hallWidth:+(b.x1-b.x0).toFixed(2),hallLength:+(b.y1-b.y0).toFixed(2)});
    layoutId=r.layoutId||layoutId;
    const rec=LAYOUTS.find(l=>l.id===layoutId),data=JSON.stringify(layoutForSave());
    if(rec){rec.name=name;rec.data=data}else LAYOUTS.unshift({id:layoutId,name,data});
    fillLayouts();
    const cur=currentSeats(),changes=[];
    cur.forEach((v,id)=>{if(baseline.get(id)!==v){const[d,s]=v.split("|");changes.push({id,desk:d?+d:null,seat:s?+s:null})}});
    if(changes.length)await callFlow({action:"saveSeats",assignments:changes});
    changes.forEach(c=>{const a=attById[c.id];if(a){a.desk=c.desk;a.seat=c.seat}baseline.set(c.id,(c.desk||"")+"|"+(c.seat||""))});
    dirty=false;setDirty();flash(`Saved${changes.length?` · ${changes.length} seat change${changes.length>1?"s":""}`:""}`);
  }catch(e){flash(e.noAccess?"No access to save":"Save failed: "+e.message)}
  $("bSave").disabled=false;$("bSave").textContent="Save"}

/* ---------- helpers ---------- */
function save(){dirty=true;setDirty()}
function setDirty(){const d=$("dirty");d.textContent=dirty?"Unsaved changes":"All changes saved";d.className=dirty?"un":""}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function flash(t){$("msg").textContent=t;clearTimeout(msgT);msgT=setTimeout(()=>$("msg").textContent="",4500)}
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function tx(p,x,y,s,fs,fill,extra){const t=el("text",Object.assign({x,y,"font-size":fs,fill:fill||"#e8eef5","text-anchor":"middle","pointer-events":"none","font-family":"Segoe UI,sans-serif"},extra||{}),p);t.textContent=s;return t}
const snap=v=>Math.round(v*2)/2;
function tables(){return S.items.filter(i=>i.k==="t")}
function zones(){return S.items.filter(i=>i.k==="z")}
function find(id){return S.items.find(i=>i.id===id)}
function seated(){const s=new Set();tables().forEach(t=>t.seats.forEach((x,i)=>{if(i>0&&x)s.add(x.a)}));return s}
function pool(){const s=seated();return ATT.filter(a=>!s.has(a.id))}
function nextNum(){return tables().reduce((m,t)=>Math.max(m,t.num),0)+1}
function hostOf(uid){const t=tables().find(t=>t.seats[0]&&t.seats[0].u===uid);return t?t.num:null}
function stationOf(uid){const z=zones().find(z=>(z.staff||[]).includes(uid));return z?z.label:null}
function empName(id){return empById[id]?empById[id].name:"(unknown)"}
function mkTable(x,y,shape,chairs,num){return{k:"t",id:S.nid++,num,shape,chairs,rot:0,x,y,seats:Array(chairs).fill(null)}}
function mkZone(label,x,y,w,h,kind){return{k:"z",id:S.nid++,label,shape:"rect",x:+x.toFixed(1),y:+y.toFixed(1),w:+w.toFixed(1),h:+h.toFixed(1),rot:0,kind,staff:[],pts:null}}

/* ---------- geometry ---------- */
function dims(t){const n=t.chairs;
  if(t.shape==="round"){const R=Math.max(1.3,n*.7/(2*Math.PI));return{e:1,rx:R,ry:R,tx:R-.45,ty:R-.45}}
  if(t.shape==="oval"){const b=Math.max(1,n*.7/8.975),a=b*1.8;return{e:1,rx:a,ry:b,tx:a-.45,ty:b-.45}}
  if(t.shape==="square"){const R=Math.max(1.3,n*.7/8);return{e:0,rx:R,ry:R,tx:R-.45,ty:R-.45}}
  const len=Math.max(1.8,Math.ceil(n/2)*.7);return{e:0,long:1,rx:len/2+.45,ry:.9,tx:len/2,ty:.45}}
function chairPos(t,i){const d=dims(t),n=t.chairs;
  if(d.e){const a=-Math.PI/2+i*2*Math.PI/n;return[Math.cos(a)*d.rx,Math.sin(a)*d.ry]}
  if(d.long){const top=Math.ceil(n/2),bot=n-top;
    if(i<top){const sp=2*d.tx/top;return[-d.tx+sp*(i+.5),-d.ry]}
    const k=i-top,sp=2*d.tx/Math.max(1,bot);return[d.tx-sp*(k+.5),d.ry]}
  const w=2*d.rx,h=2*d.ry,s=2*(w+h)/n;let p=s*(i+.5);
  if(p<w)return[-d.rx+p,-d.ry];p-=w;if(p<h)return[d.rx,-d.ry+p];p-=h;if(p<w)return[d.rx-p,d.ry];p-=w;return[-d.rx,d.ry-p]}
function hb(){const h=S.hall;if(h.type==="ellipse")return{x0:0,y0:0,x1:h.W,y1:h.L};
  const xs=h.pts.map(p=>p[0]),ys=h.pts.map(p=>p[1]);return{x0:Math.min(...xs),y0:Math.min(...ys),x1:Math.max(...xs),y1:Math.max(...ys)}}
function inside(x,y){const h=S.hall;
  if(h.type==="ellipse"){const a=h.W/2,b=h.L/2;return((x-a)/a)**2+((y-b)/b)**2<=1}
  let c=false;const P=h.pts;for(let i=0,j=P.length-1;i<P.length;j=i++){const[xi,yi]=P[i],[xj,yj]=P[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c}
function fitsAt(x,y,rx,ry){if(!inside(x,y))return false;for(let k=0;k<8;k++){const a=k*Math.PI/4;if(!inside(x+Math.cos(a)*(rx+.3),y+Math.sin(a)*(ry+.3)))return false}return true}
function spanAt(y){const b=hb();let lo=null,hi=null;for(let x=b.x0;x<=b.x1;x+=.25)if(inside(x,y)){if(lo===null)lo=x;hi=x}return lo===null?null:[lo,hi]}
function zbox(z){if(z.shape==="poly"){const xs=z.pts.map(p=>p[0]),ys=z.pts.map(p=>p[1]);return{x:z.x+Math.min(...xs),y:z.y+Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)}}return{x:z.x,y:z.y,w:z.w,h:z.h}}
function hitsZone(x,y,rx,ry){return zones().some(z=>{const b=zbox(z);return x+rx+.4>b.x&&x-rx-.4<b.x+b.w&&y+ry+.4>b.y&&y-ry-.4<b.y+b.h})}
function applyHall(preset,W,L){const h=S.hall;h.preset=preset;h.W=W;h.L=L;
  if(preset==="oval"){h.type="ellipse";h.pts=null}else{h.type="poly";h.pts=preset==="L"?lPts(W,L):rectPts(W,L)}}
function toCustom(){const h=S.hall;
  if(h.type==="ellipse"){h.pts=Array.from({length:16},(_,k)=>{const a=k*Math.PI/8;return[+(h.W/2+Math.cos(a)*h.W/2).toFixed(1),+(h.L/2+Math.sin(a)*h.L/2).toFixed(1)]});h.type="poly"}
  h.preset="custom"}

/* ---------- generate ---------- */
function generate(){
  const W=+$("iW").value,L=+$("iL").value,N=+$("iN").value,shape=$("iS").value,ch=Math.round(+$("iC").value);
  if(!(W>=10&&W<=300&&L>=10&&L<=300)){flash("Width and length must be 10–300 m");return}
  if(!(N>=1&&N<=3000)){flash("Guests must be 1–3000");return}
  if(!(ch>=1&&ch<=40)){flash("Chairs must be 1–40");return}
  if(S.items.length&&!confirm("Replace all tables and zones in this layout?"))return;
  S.items=[];S.nid=1;
  if(S.hall.preset!=="custom")applyHall(S.hall.preset||"rect",W,L);
  const b=hb(),H=b.y1-b.y0,Wd=b.x1-b.x0;
  const sh=Math.min(5,H*.15),sp=spanAt(b.y0+1+sh/2);
  if(sp){const sw=Math.min(16,(sp[1]-sp[0])*.5),sx=(sp[0]+sp[1])/2-sw/2;
    S.items.push(mkZone("Stage · Тайз",sx,b.y0+1,sw,sh,"stage"));
    if(inside(sx-2.2,b.y0+1.5)&&inside(sx-2.2,b.y0+1.5+sh*.7))S.items.push(mkZone("LED",sx-2.2,b.y0+1.5,1.4,sh*.7,"display"));
    if(inside(sx+sw+2.2,b.y0+1.5)&&inside(sx+sw+2.2,b.y0+1.5+sh*.7))S.items.push(mkZone("LED",sx+sw+.8,b.y0+1.5,1.4,sh*.7,"display"))}
  const se=spanAt(b.y1-.5);if(se)S.items.push(mkZone("Entrance · Орц",(se[0]+se[1])/2-2,b.y1-.9,4,.6,"entrance"));
  const sr=spanAt(b.y1-3);if(sr)S.items.push(mkZone("Registration · Бүртгэл",sr[0]+.8,b.y1-4.6,Math.min(7,(sr[1]-sr[0])*.25),3.2,"area"));
  const bw=Math.min(6,Wd*.12),bh=H*.3,my=(b.y0+b.y1)/2,sb=spanAt(my);
  if(sb){const bx=sb[1]-bw-.8,by=my-bh/2;if([[bx,by],[bx+bw,by],[bx,by+bh],[bx+bw,by+bh]].every(p=>inside(p[0],p[1])))S.items.push(mkZone("Buffet",bx,by,bw,bh,"area"))}
  const d=dims({shape,chairs:ch}),px=2*d.rx+1.2,py=2*d.ry+1.2,need=Math.ceil(N/Math.max(1,ch-1));
  let made=0,num=1;
  for(let y=b.y0+d.ry+.8;y<=b.y1-d.ry&&made<need;y+=py)for(let x=b.x0+d.rx+.8;x<=b.x1-d.rx&&made<need;x+=px){
    if(fitsAt(x,y,d.rx,d.ry)&&!hitsZone(x,y,d.rx,d.ry)){S.items.push(mkTable(+x.toFixed(1),+y.toFixed(1),shape,ch,num++));made++}}
  sel=null;vtx=-1;fit();refresh();
  flash(made<need?`Hall fits ${made} tables (${made*Math.max(0,ch-1)} guests). Make it bigger for ${N}.`:`${made} tables placed`)}

/* ---------- drawing ---------- */
function chairCol(t,i){const s=t.seats[i];
  if(i===0)return s?["#8f86e8","#5d54c4"]:["none","#8f86e8"];
  if(!s)return["none","#4a90d9"];const a=attById[s.a];return a&&a.arrived?["#4aa564","#2f7a45"]:["#e0a526","#a8780f"]}
function drawHall(){HG.innerHTML="";const h=S.hall,b=hb(),fs=Math.max(.5,Math.min(b.x1-b.x0,b.y1-b.y0)/45),on=sel==="hall";
  const a={fill:"url(#m5)",stroke:on?"#e0a526":"#4a90d9","stroke-width":on?2.5:2,"stroke-dasharray":"8 5","vector-effect":"non-scaling-stroke"};
  if(h.type==="ellipse")el("ellipse",Object.assign({cx:h.W/2,cy:h.L/2,rx:h.W/2,ry:h.L/2},a),HG);
  else el("polygon",Object.assign({points:h.pts.map(p=>p.join(",")).join(" ")},a),HG);
  tx(HG,(b.x0+b.x1)/2,b.y0-.8,Math.round(b.x1-b.x0)+" m",fs,"#8aa0b8");
  tx(HG,b.x0-.8,(b.y0+b.y1)/2,Math.round(b.y1-b.y0)+" m",fs,"#8aa0b8",{transform:`rotate(-90 ${b.x0-.8} ${(b.y0+b.y1)/2})`})}
function drawItems(){IG.innerHTML="";
  [...zones(),...tables()].forEach((it,idx)=>{
    if(it.k==="z"){const c=KINDS[it.kind]||KINDS.area;
      let tf=`translate(${it.x},${it.y})`;if(it.shape!=="poly"&&it.rot)tf+=` rotate(${it.rot} ${it.w/2} ${it.h/2})`;
      const g=el("g",{class:"it"+(it.id===sel?" sel":""),transform:tf,"data-id":it.id},IG);
      const a={class:"sh",fill:c[1],"fill-opacity":c[2],stroke:c[1],"stroke-width":1.2,"stroke-dasharray":c[3],"vector-effect":"non-scaling-stroke"};
      let cx=it.w/2,cy=it.h/2,bw=it.w,bh=it.h;
      if(it.shape==="ellipse")el("ellipse",Object.assign({cx,cy,rx:it.w/2,ry:it.h/2},a),g);
      else if(it.shape==="poly"){el("polygon",Object.assign({points:it.pts.map(p=>p.join(",")).join(" ")},a),g);
        cx=it.pts.reduce((s,p)=>s+p[0],0)/it.pts.length;cy=it.pts.reduce((s,p)=>s+p[1],0)/it.pts.length;const zb=zbox(it);bw=zb.w;bh=zb.h}
      else el("rect",Object.assign({width:it.w,height:it.h,rx:.3},a),g);
      const st=(it.staff||[]).map(empName);
      const fs=Math.max(.3,Math.min(1,bh*.32,bw/Math.max(4,it.label.length)*1.7));
      tx(g,cx,cy+(st.length?0:fs*.35),it.label,fs);
      if(st.length)tx(g,cx,cy+fs*1.1,st.length<=2?st.join(", "):st.length+" staff",fs*.7,"#cfcaff");
      g.addEventListener("pointerdown",e=>startDrag(e,it))}
    else{const g=el("g",{class:"it"+(it.id===sel?" sel":""),transform:`translate(${it.x},${it.y}) rotate(${it.rot||0})`,"data-id":it.id},IG);
      it.seats.forEach((s,i)=>{const[cx,cy]=chairPos(it,i),[f,st]=chairCol(it,i);
        el("circle",{class:"ch",cx,cy,r:.3,fill:f,stroke:st,"stroke-width":1.4,"vector-effect":"non-scaling-stroke",style:`animation-delay:${Math.min(idx*6+i*15,500)}ms`},g)});
      const d=dims(it),a={class:"sh",fill:"#4a90d9","fill-opacity":.16,stroke:"#4a90d9","stroke-width":1.2,"vector-effect":"non-scaling-stroke"};
      if(d.e)el("ellipse",Object.assign({rx:d.tx,ry:d.ty},a),g);else el("rect",Object.assign({x:-d.tx,y:-d.ty,width:2*d.tx,height:2*d.ty,rx:.15},a),g);
      tx(g,0,.28,String(it.num),Math.min(.8,d.ty*1.2+.2),"#e8eef5",{transform:`rotate(${-(it.rot||0)})`});
      g.addEventListener("pointerdown",e=>startDrag(e,it))}})}
function handleTarget(){if(sel==="hall"&&S.hall.type==="poly")return{pts:S.hall.pts,ox:0,oy:0,hall:true};
  const z=sel!=null&&sel!=="hall"?find(sel):null;if(z&&z.k==="z"&&z.shape==="poly")return{pts:z.pts,ox:z.x,oy:z.y,z};return null}
function drawHandles(){HD.innerHTML="";const t=handleTarget();if(!t)return;const r=vb.w/110;
  t.pts.forEach((p,i)=>{const c=el("circle",{cx:p[0]+t.ox,cy:p[1]+t.oy,r,fill:i===vtx?"#e0a526":"#0b1e35",stroke:"#e0a526","stroke-width":2,"vector-effect":"non-scaling-stroke",style:"cursor:pointer"},HD);
    c.addEventListener("pointerdown",e=>{e.stopPropagation();vtx=i;drag={v:1,t,i,moved:false};svg.setPointerCapture(e.pointerId);drawHandles();panel()})})}
function stats(){const T=tables();let cap=0,seat=0,arr=0,nohost=0;
  T.forEach(t=>{cap+=Math.max(0,t.chairs-1);if(!t.seats[0])nohost++;t.seats.forEach((s,i)=>{if(i>0&&s){seat++;if(attById[s.a]&&attById[s.a].arrived)arr++}})});
  const staff=zones().reduce((n,z)=>n+(z.staff||[]).length,0);
  $("stats").innerHTML=`<div class="stat"><b>${T.length}</b><span>Tables</span></div><div class="stat"><b>${seat} / ${cap}</b><span>Seated / capacity</span></div>
  <div class="stat"><b>${ATT.length-seat}</b><span>Unseated guests</span></div><div class="stat"><b>${arr}</b><span>Arrived (seated)</span></div>
  <div class="note">${nohost?`${nohost} table${nohost>1?"s":""} without a host · `:""}${staff} staff stationed in zones</div>`}

/* ---------- side panel ---------- */
function cornerButtons(){return`<div style="display:flex;gap:6px;margin-bottom:10px"><button id="vadd">+ Corner</button><button id="vdel">− Corner</button></div>`}
function bindCorners(){const add=$("vadd"),del=$("vdel");if(!add)return;
  add.onclick=()=>{const t=handleTarget();if(!t)return;if(vtx<0){flash("Select a corner first");return}
    const a=t.pts[vtx],b=t.pts[(vtx+1)%t.pts.length];t.pts.splice(vtx+1,0,[snap((a[0]+b[0])/2),snap((a[1]+b[1])/2)]);vtx++;refresh()};
  del.onclick=()=>{const t=handleTarget();if(!t)return;if(vtx<0){flash("Select a corner first");return}
    if(t.pts.length<=3){flash("A shape needs at least 3 corners");return}t.pts.splice(vtx,1);vtx=-1;refresh()}}

    <p class="sub" style="margin-top:12px;line-height:1.5">Click a table to seat guests, or a zone to station staff. Drag to move. Scroll to zoom, drag empty space to pan.</p>`;guestList(null);return}
  if(it.k==="z"){it.staff=it.staff||[];
    P.innerHTML=`<h2>Zone</h2>
      <label class="f" style="margin-bottom:8px">Name<input id="zl" value="${esc(it.label)}"></label>

        <label class="f" style="flex:1">Type<select id="zk">${Object.entries(KINDS).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join("")}</select></label>
        <label class="f" style="flex:1">Shape<select id="zs"><option value="rect">Rectangle</option><option value="ellipse">Oval</option><option value="poly">Custom corners</option></select></label></div>
      ${it.shape==="poly"?`<p class="sub" style="line-height:1.5">Drag the amber handles to shape the zone.</p>${cornerButtons()}`
      :`<div style="display:flex;gap:8px;margin-bottom:8px"><label class="f">Width (m)<input id="zw" type="number" min="0.5" max="300" step="0.5" value="${it.w}"></label>
        <label class="f">Depth (m)<input id="zh" type="number" min="0.5" max="300" step="0.5" value="${it.h}"></label>
        <label class="f">Rotate (°)<input id="zr" type="number" min="0" max="345" step="15" value="${it.rot||0}"></label></div>`}
      <h2 style="margin-top:14px">Stationed here</h2>
      <div>${it.staff.map(id=>`<span class="chip">${esc(empName(id))}<button data-s="${id}" title="Remove">✕</button></span>`).join("")||'<p class="sub">No one yet.</p>'}</div>
      <input id="zq" placeholder="Search employees" style="width:100%;margin:6px 0">
      <div id="zlist" style="max-height:220px;overflow-y:auto;margin-bottom:14px"></div>
      <button id="zdel">Remove zone</button>`;
    $("zk").value=it.kind;$("zs").value=it.shape;
    $("zl").oninput=e=>{it.label=e.target.value;drawItems();save()};
    $("zk").onchange=e=>{it.kind=e.target.value;refresh()};
    $("zs").onchange=e=>{const v=e.target.value,b=zbox(it);
      if(v==="poly"){it.pts=it.shape==="ellipse"?Array.from({length:12},(_,k)=>{const a=k*Math.PI/6;return[+(it.w/2+Math.cos(a)*it.w/2).toFixed(1),+(it.h/2+Math.sin(a)*it.h/2).toFixed(1)]}):rectPts(it.w,it.h);it.rot=0}
      else if(it.shape==="poly"){it.x=+b.x.toFixed(1);it.y=+b.y.toFixed(1);it.w=+b.w.toFixed(1);it.h=+b.h.toFixed(1);it.pts=null}
      it.shape=v;vtx=-1;refresh()};
    if($("zw")){$("zw").onchange=e=>{it.w=Math.max(.5,+e.target.value||.5);refresh()};$("zh").onchange=e=>{it.h=Math.max(.5,+e.target.value||.5);refresh()};
      $("zr").onchange=e=>{it.rot=((Math.round(+e.target.value/15)*15)%360+360)%360;refresh()}}

      $("zlist").querySelectorAll("[data-u]").forEach(r=>r.onclick=()=>{it.staff.push(r.dataset.u);refresh()})};
    $("zq").addEventListener("input",runZ);runZ();
    $("zdel").onclick=()=>{S.items=S.items.filter(x=>x!==it);sel=null;vtx=-1;refresh()};return}
  const h=it.seats[0],hz=h?stationOf(h.u):null;

    <div style="display:flex;gap:8px;margin-bottom:10px">
      <label class="f" style="flex:1">Shape<select id="tsh"><option value="round">Round</option><option value="square">Square</option><option value="oval">Oval</option><option value="long">Long</option></select></label>
      <label class="f">Chairs<input id="tch" type="number" min="1" max="40" step="1" value="${it.chairs}"></label>

    <div class="row"><span class="dot" style="background:${h?"#8f86e8":"transparent"};border-color:#8f86e8"></span><span class="sub" style="width:44px">Seat 1</span>
      <span class="nm">${h?esc(empName(h.u)):'<span class="sub">No host yet</span>'}</span>
      ${h?`<select id="hRole">${ROLES.map(r=>`<option${h.role===r?" selected":""}>${r}</option>`).join("")}</select><button class="x" id="hRem" title="Remove host">✕</button>`:""}</div>
    ${hz?`<p class="sub" style="margin:4px 0 0 6px;color:var(--amber)">This host is also stationed at ${esc(hz)}.</p>`:""}
    ${h?"":`<input id="hq" placeholder="Search employee to host" style="width:100%;margin:6px 0"><div id="hlist" style="max-height:180px;overflow-y:auto"></div>`}
    <div id="seats"></div>
    <h2 style="margin-top:16px">Add guests</h2><input id="gq" placeholder="Search name or company" style="width:100%;margin-bottom:8px"><div id="gl"></div>`;
  $("tsh").value=it.shape;
  if(h){$("hRole").onchange=e=>{h.role=e.target.value;save()};$("hRem").onclick=()=>{it.seats[0]=null;refresh()}}
  else{const runH=()=>{const q=$("hq").value.trim().toLowerCase();
      const list=EMP.filter(u=>!q||u.name.toLowerCase().includes(q)).slice(0,40);
      $("hlist").innerHTML=list.map(u=>{const t=hostOf(u.id),z=stationOf(u.id);return`<div class="row g" data-u="${u.id}"><span class="nm">${esc(u.name)}</span>${t?`<span class="sub">hosts table ${t}</span>`:""}${z?`<span class="sub">at ${esc(z)}</span>`:""}</div>`}).join("")||'<p class="sub">No matches.</p>';
      $("hlist").querySelectorAll("[data-u]").forEach(r=>r.onclick=()=>{it.seats[0]={u:r.dataset.u,role:"Sales rep"};refresh()})};

    <span class="sub" style="width:44px">Seat ${i+1}</span><span class="nm">${a?esc(a.name)+` <span class="sub">${esc(a.company)}</span>`:'<span class="sub">Empty</span>'}</span>
    ${a&&a.arrived?'<span class="tag">Arrived</span>':""}${a?`<button class="x" data-i="${i}" title="Remove">✕</button>`:""}</div>`}).join("");
  $("seats").querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{it.seats[+b.dataset.i]=null;refresh()});
  $("tsh").onchange=e=>{it.shape=e.target.value;refresh()};
  $("tch").onchange=e=>{const n=Math.round(+e.target.value);if(!(n>=1&&n<=40)){flash("Chairs must be 1–40");e.target.value=it.chairs;return}
    it.chairs=n;it.seats=Array.from({length:n},(_,i)=>it.seats[i]||null);refresh()};
  $("trot").onchange=e=>{it.rot=((Math.round(+e.target.value/15)*15)%360+360)%360;refresh()};
  $("tdel").onclick=()=>{if(!confirm(`Remove table ${it.num}? Its guests become unseated.`))return;S.items=S.items.filter(x=>x!==it);sel=null;refresh()};
  guestList(it)}
function guestList(t){const q=$("gq"),box=$("gl");
  const run=()=>{const s=q.value.trim().toLowerCase();
    const list=pool().filter(a=>!s||(a.name+" "+a.company).toLowerCase().includes(s)).slice(0,80);
    box.innerHTML=list.length?list.map(a=>`<div class="row g" data-a="${a.id}"><span class="nm">${esc(a.name)}<br><span class="sub">${esc(a.company)}</span></span>${a.arrived?'<span class="tag">Arrived</span>':""}</div>`).join("")
      :'<p class="sub">No unseated guests match.</p>';
    box.querySelectorAll("[data-a]").forEach(r=>r.onclick=()=>{
      if(!t){flash("Select a table first");return}
      const i=t.seats.findIndex((x,k)=>k>0&&!x);if(i<0){flash(`Table ${t.num} is full`);return}
      t.seats[i]={a:r.dataset.a};const keep=q.value;refresh();const nq=$("gq");if(nq){nq.value=keep;nq.dispatchEvent(new Event("input"))}})};
  q.addEventListener("input",run);run()}

function refresh(){drawHall();drawItems();drawHandles();stats();panel();save()}

/* ---------- view and pointer ---------- */
function setVB(){svg.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);drawHandles()}
function fit(){const b=hb(),r=(svg.clientWidth/svg.clientHeight)||1.6,pad=Math.max(b.x1-b.x0,b.y1-b.y0)*.07,w=b.x1-b.x0+pad*2,h=b.y1-b.y0+pad*2;
  vb=w/h>r?{x:b.x0-pad,y:b.y0-pad-(w/r-h)/2,w,h:w/r}:{x:b.x0-pad-(h*r-w)/2,y:b.y0-pad,w:h*r,h};setVB()}
function zoomAt(px,py,f){vb.x=px-(px-vb.x)*f;vb.y=py-(py-vb.y)*f;vb.w*=f;vb.h*=f;setVB()}
function pt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function startDrag(e,it){e.stopPropagation();const p=pt(e);drag={it,dx:p.x-it.x,dy:p.y-it.y,moved:false};
  if(sel!==it.id){sel=it.id;vtx=-1;drawHall();drawItems();drawHandles();panel()}svg.setPointerCapture(e.pointerId)}
svg.addEventListener("pointerdown",e=>{if(drag)return;pan={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y,moved:false};svg.setPointerCapture(e.pointerId)});
svg.addEventListener("pointermove",e=>{
  if(drag&&drag.v){const p=pt(e),t=drag.t;
    if(t.hall&&S.hall.preset!=="custom")S.hall.preset="custom";
    t.pts[drag.i]=[snap(p.x-t.ox),snap(p.y-t.oy)];drag.moved=true;drawHall();drawItems();drawHandles()}
  else if(drag){const p=pt(e),it=drag.it;it.x=snap(p.x-drag.dx);it.y=snap(p.y-drag.dy);drag.moved=true;drawItems();drawHandles()}
  else if(pan){const s=vb.w/svg.clientWidth,dx=e.clientX-pan.x,dy=e.clientY-pan.y;if(Math.abs(dx)+Math.abs(dy)>3)pan.moved=true;
    vb.x=pan.vx-dx*s;vb.y=pan.vy-dy*s;setVB()}});
svg.addEventListener("pointerup",()=>{if(drag&&drag.moved){save();if(drag.v)panel()}
  if(pan&&!pan.moved&&sel!=null&&sel!=="hall"){sel=null;vtx=-1;drawItems();drawHandles();panel()}drag=null;pan=null});
svg.addEventListener("wheel",e=>{e.preventDefault();const p=pt(e);zoomAt(p.x,p.y,e.deltaY>0?1.12:.89)},{passive:false});

/* ---------- toolbar ---------- */
$("bSave").onclick=saveAll;
$("lsel").onchange=e=>{const v=e.target.value;
  if(dirty&&!confirm("You have unsaved changes. Discard them?")){e.target.value=layoutId||"__new";return}
  if(v==="__new")newLayout();else openLayout(v)};
$("bGen").onclick=generate;
$("bHall").onclick=()=>{sel="hall";vtx=-1;refresh()};
$("bT").onclick=()=>{const ch=Math.round(+$("iC").value);if(!(ch>=1&&ch<=40)){flash("Chairs must be 1–40");return}
  const t=mkTable(snap(vb.x+vb.w/2),snap(vb.y+vb.h/2),$("iS").value,ch,nextNum());S.items.push(t);sel=t.id;refresh()};
$("bZ").onclick=()=>{const z=mkZone("New zone",vb.x+vb.w/2-3,vb.y+vb.h/2-2,6,4,"area");S.items.push(z);sel=z.id;refresh()};
$("bAuto").onclick=()=>{const p=pool().sort((a,b)=>a.company.localeCompare(b.company));let k=0;
  tables().sort((a,b)=>a.num-b.num).forEach(t=>{for(let i=1;i<t.chairs;i++)if(!t.seats[i]&&k<p.length)t.seats[i]={a:p[k++].id}});
  refresh();flash(k?`Seated ${k} guests`:"No empty seats or no unseated guests")};
$("bClear").onclick=()=>{if(!confirm("Remove all guests from tables? Hosts and zone staff stay. Nothing changes in Dataverse until you Save."))return;tables().forEach(t=>t.seats=t.seats.map((s,i)=>i===0?s:null));refresh()};
$("bZi").onclick=()=>zoomAt(vb.x+vb.w/2,vb.y+vb.h/2,.8);
$("bZo").onclick=()=>zoomAt(vb.x+vb.w/2,vb.y+vb.h/2,1.25);
$("bFit").onclick=fit;
$("bExp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(layoutForSave(),null,1)],{type:"application/json"}));a.download=($("lname").value.trim()||"cid-layout")+".json";a.click()};
$("bImp").onclick=()=>$("fImp").click();
$("fImp").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.hall||!Array.isArray(o.items))throw 0;S=o;layoutId="";$("lsel").value="__new";applySeats();sel=null;vtx=-1;fit();refresh();flash("Layout imported as a new layout. Name it and Save.")}catch(x){flash("That file isn't a valid layout")}};r.readAsText(f);e.target.value=""};
window.addEventListener("resize",fit);
window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});
/* ---------- 3D view ---------- */
let R3=null;
function label3(text,color,size){
  const c=document.createElement("canvas");c.width=512;c.height=128;const x=c.getContext("2d");
  let fs=64;x.font=`bold ${fs}px Segoe UI, sans-serif`;
  while(x.measureText(text).width>490&&fs>20){fs-=4;x.font=`bold ${fs}px Segoe UI, sans-serif`}
  x.textAlign="center";x.textBaseline="middle";x.fillStyle="#"+color.toString(16).padStart(6,"0");x.fillText(text,256,64);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true}));
  sp.scale.set(size*4,size,1);return sp}
function open3D(){
  if(typeof THREE==="undefined"||!THREE.OrbitControls){flash("The 3D engine didn't load. Check your connection and reload.");return}
  const box=$("v3d");box.style.top=document.querySelector("header").offsetHeight+"px";box.style.display="block";
  const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(box.clientWidth,box.clientHeight);renderer.shadowMap.enabled=true;box.appendChild(renderer.domElement);
  const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b0b0b);
  const b=hb(),cx=(b.x0+b.x1)/2,cz=(b.y0+b.y1)/2,span=Math.max(b.x1-b.x0,b.y1-b.y0);
  scene.fog=new THREE.Fog(0x0b0b0b,span*1.6,span*4);
  const cam=new THREE.PerspectiveCamera(50,box.clientWidth/box.clientHeight,0.1,span*10);
  scene.add(new THREE.HemisphereLight(0xffffff,0x222222,0.75));
  const sun=new THREE.DirectionalLight(0xffffff,0.8);sun.position.set(cx+span*.4,span,cz+span*.3);sun.target.position.set(cx,0,cz);
  sun.castShadow=true;Object.assign(sun.shadow.camera,{left:-span,right:span,top:span,bottom:-span,far:span*3});sun.shadow.mapSize.set(2048,2048);
  scene.add(sun,sun.target);
  const outline=S.hall.type==="ellipse"
    ?Array.from({length:72},(_,k)=>{const a=k/72*Math.PI*2;return[S.hall.W/2+Math.cos(a)*S.hall.W/2,S.hall.L/2+Math.sin(a)*S.hall.L/2]})
    :S.hall.pts;
  const shapeOf=pts=>{const s=new THREE.Shape();pts.forEach((p,i)=>i?s.lineTo(p[0],p[1]):s.moveTo(p[0],p[1]));return s};
  const floor=new THREE.Mesh(new THREE.ShapeGeometry(shapeOf(outline)).rotateX(Math.PI/2),new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:.9,side:THREE.DoubleSide}));
  floor.receiveShadow=true;scene.add(floor);
  const grid=new THREE.GridHelper(Math.ceil(span)+10,Math.ceil(span)+10,0x3a3208,0x222222);grid.position.set(cx,0.005,cz);scene.add(grid);
  const wallMat=new THREE.MeshStandardMaterial({color:0x4a90d9,transparent:true,opacity:.12,side:THREE.DoubleSide});
  for(let i=0;i<outline.length;i++){const p=outline[i],q=outline[(i+1)%outline.length],len=Math.hypot(q[0]-p[0],q[1]-p[1]);if(len<.01)continue;
    const w=new THREE.Mesh(new THREE.PlaneGeometry(len,3),wallMat);w.position.set((p[0]+q[0])/2,1.5,(p[1]+q[1])/2);w.rotation.y=-Math.atan2(q[1]-p[1],q[0]-p[0]);scene.add(w)}
  const edge=new THREE.LineBasicMaterial({color:0xFFCD11});
  scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(outline.map(p=>new THREE.Vector3(p[0],3,p[1]))),edge));
  scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(outline.map(p=>new THREE.Vector3(p[0],.01,p[1]))),edge));
  const KC={stage:0x4a90d9,display:0xe0a526,area:0x4a90d9,entrance:0x4aa564};
  zones().forEach(z=>{
    let pts;
    if(z.shape==="poly")pts=z.pts.map(p=>[z.x+p[0],z.y+p[1]]);
    else if(z.shape==="ellipse")pts=Array.from({length:40},(_,k)=>{const a=k/40*Math.PI*2;return[z.x+z.w/2+Math.cos(a)*z.w/2,z.y+z.h/2+Math.sin(a)*z.h/2]});
    else pts=[[z.x,z.y],[z.x+z.w,z.y],[z.x+z.w,z.y+z.h],[z.x,z.y+z.h]];
    if(z.shape!=="poly"&&z.rot){const ox=z.x+z.w/2,oy=z.y+z.h/2,a=z.rot*Math.PI/180;
      pts=pts.map(([x,y])=>[ox+(x-ox)*Math.cos(a)-(y-oy)*Math.sin(a),oy+(x-ox)*Math.sin(a)+(y-oy)*Math.cos(a)])}
    const h=z.kind==="stage"?0.8:z.kind==="display"?3:0.03;
    const m=new THREE.Mesh(new THREE.ExtrudeGeometry(shapeOf(pts),{depth:h,bevelEnabled:false}).rotateX(Math.PI/2),
      new THREE.MeshStandardMaterial({color:KC[z.kind]||KC.area,transparent:z.kind==="area",opacity:z.kind==="area"?.35:1,roughness:.6}));
    m.position.y=h;m.castShadow=m.receiveShadow=true;scene.add(m);
    const lx=pts.reduce((s,p)=>s+p[0],0)/pts.length,lz=pts.reduce((s,p)=>s+p[1],0)/pts.length;
    const l=label3(z.label,0xffffff,.8);l.position.set(lx,h+.7,lz);scene.add(l)});
  const clickables=[],COL={empty:0x555555,host:0x8f86e8,assigned:0xe0a526,arrived:0x4aa564};
  const chairGeo=new THREE.BoxGeometry(.42,.45,.42),backGeo=new THREE.BoxGeometry(.42,.5,.06);
  tables().forEach(t=>{
    const d=dims(t),g=new THREE.Group();g.position.set(t.x,0,t.y);g.rotation.y=-(t.rot||0)*Math.PI/180;
    const topMat=new THREE.MeshStandardMaterial({color:0xdddddd,roughness:.5});let top;
    if(d.e){top=new THREE.Mesh(new THREE.CylinderGeometry(1,1,.05,40),topMat);top.scale.set(d.tx,1,d.ty)}
    else top=new THREE.Mesh(new THREE.BoxGeometry(2*d.tx,.05,2*d.ty),topMat);
    top.position.y=.75;top.castShadow=top.receiveShadow=true;g.add(top);
    const leg=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.72,10),new THREE.MeshStandardMaterial({color:0x333333}));leg.position.y=.36;g.add(leg);
    t.seats.forEach((s,i)=>{
      const[px,py]=chairPos(t,i);let st="empty",info={};
      if(i===0){if(s){st="host";info={who:empName(s.u),sub:s.role||"Host"}}}
      else if(s){const a=attById[s.a];if(a){st=a.arrived?"arrived":"assigned";info={who:a.name,sub:a.company}}}
      const mat=new THREE.MeshStandardMaterial({color:COL[st],roughness:.6});
      const c=new THREE.Mesh(chairGeo,mat);c.position.set(px,.225,py);c.castShadow=true;
      const ang=Math.atan2(py,px),bk=new THREE.Mesh(backGeo,mat);
      bk.position.set(px+Math.cos(ang)*.21,.7,py+Math.sin(ang)*.21);bk.rotation.y=Math.PI/2-ang;bk.castShadow=true;
      c.userData=bk.userData=Object.assign({table:t.num,seat:i+1,st},info);
      g.add(c,bk);clickables.push(c,bk)});
    const l=label3(String(t.num),0xFFCD11,.9);l.position.set(0,1.45,0);g.add(l);
    scene.add(g)});
  const ctl=new THREE.OrbitControls(cam,renderer.domElement);ctl.target.set(cx,0,cz);ctl.enableDamping=true;
  ctl.maxPolarAngle=Math.PI/2.05;ctl.minDistance=1.5;ctl.maxDistance=span*4;
  const stage=zones().find(z=>z.kind==="stage"),ent=zones().find(z=>z.kind==="entrance");
  const zc=z=>{const q=zbox(z);return[q.x+q.w/2,q.y+q.h/2]};
  const presets={
    top:[[cx,span*1.25,cz+.01],[cx,0,cz]],
    iso:[[cx+span*.65,span*.55,cz+span*.65],[cx,0,cz]],
    stage:stage?(()=>{const[sx,sz]=zc(stage);return[[sx,2.6,sz],[cx,.8,cz]]})():null,
    entrance:ent?(()=>{const[ex,ez]=zc(ent),tg=stage?zc(stage):[cx,cz],dx=tg[0]-ex,dz=tg[1]-ez,l=Math.hypot(dx,dz)||1;
      return[[ex+dx/l,1.7,ez+dz/l],[tg[0],1.2,tg[1]]]})():null};
  let anim=null;
  function go(k){const p=presets[k];if(!p){flash(k==="stage"?"Add a zone of type Stage first":"Add a zone of type Entrance first");return}
    anim={t:0,fp:cam.position.clone(),ft:ctl.target.clone(),tp:new THREE.Vector3(...p[0]),tt:new THREE.Vector3(...p[1])}}
  cam.position.set(...presets.iso[0]);ctl.update();
  const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),tip=$("v3dtip");let downAt=null;
  const onDown=e=>{downAt=[e.clientX,e.clientY]};
  const onUp=e=>{if(!downAt||Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>4)return;
    const r=renderer.domElement.getBoundingClientRect();
    mouse.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(mouse,cam);
    const hit=ray.intersectObjects(clickables)[0];
    if(hit){const u=hit.object.userData;
      tip.innerHTML=`<b>Table ${u.table} · Seat ${u.seat}</b><br>`+(u.who?`${esc(u.who)}<br><span style="color:#8aa0b8">${esc(u.sub||"")}</span>`:`<span style="color:#8aa0b8">Empty seat</span>`);
      tip.style.left=(e.clientX-r.left+12)+"px";tip.style.top=(e.clientY-r.top+12)+"px";tip.style.display="block"}
    else tip.style.display="none"};
  renderer.domElement.addEventListener("pointerdown",onDown);renderer.domElement.addEventListener("pointerup",onUp);
  const onResize=()=>{cam.aspect=box.clientWidth/box.clientHeight;cam.updateProjectionMatrix();renderer.setSize(box.clientWidth,box.clientHeight)};
  window.addEventListener("resize",onResize);
  const clock=new THREE.Clock();let raf;
  (function loop(){raf=requestAnimationFrame(loop);const dt=clock.getDelta();
    if(anim){anim.t=Math.min(1,anim.t+dt/.9);const k=anim.t<.5?2*anim.t*anim.t:1-Math.pow(-2*anim.t+2,2)/2;
      cam.position.lerpVectors(anim.fp,anim.tp,k);ctl.target.lerpVectors(anim.ft,anim.tt,k);if(anim.t>=1)anim=null}
    ctl.update();renderer.render(scene,cam)})();
  R3={go,close(){cancelAnimationFrame(raf);window.removeEventListener("resize",onResize);ctl.dispose();renderer.dispose();
    renderer.domElement.remove();tip.style.display="none";box.style.display="none";R3=null}};
}
$("b3d").onclick=()=>{if(!R3)open3D()};
document.querySelectorAll("#v3dbar [data-cam]").forEach(b=>b.onclick=()=>{if(R3)R3.go(b.dataset.cam)});
$("v3dclose").onclick=()=>{if(R3)R3.close()};
setDirty();
initAuth();
</script>
