<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CID Portal Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--y:#FFCD11;--k:#111}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--k);color:#fff;font-family:"Barlow","Segoe UI",system-ui,sans-serif;overflow:hidden}
.hero{position:relative;height:100vh;min-height:480px;overflow:hidden}
.media,.media video,.slide{position:absolute;inset:0;width:100%;height:100%}
.media video{object-fit:cover}
.slide{background-size:cover;background-position:center;opacity:0;transform:scale(1.02);transition:opacity 1.6s ease}
.slide.on{opacity:1;animation:kb 9s linear forwards}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.12)}}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.55) 40%,rgba(0,0,0,.1) 75%),linear-gradient(0deg,rgba(0,0,0,.7) 0%,transparent 40%)}
.content{position:relative;z-index:2;height:100%;max-width:1320px;margin:0 auto;padding:0 56px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font-size:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.8);animation:up .8s .2s ease both}
.eyebrow i{width:34px;height:4px;background:var(--y);border-radius:2px}
h1{font-size:clamp(44px,6vw,88px);line-height:.98;font-weight:800;margin:18px 0 18px;letter-spacing:-.015em;animation:up .9s .35s ease both}
h1 span{color:var(--y)}
.lead{font-size:clamp(16px,1.5vw,20px);line-height:1.55;color:rgba(255,255,255,.8);max-width:560px;animation:up .9s .5s ease both}
.lead small{display:block;color:rgba(255,255,255,.6);font-size:.85em;margin-top:6px}
@keyframes up{from{opacity:0;transform:translateY(22px)}}
.pill{position:absolute;z-index:3;left:50%;bottom:44px;transform:translateX(-50%);display:flex;gap:4px;padding:8px;border-radius:999px;
  background:rgba(17,17,17,.55);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:pillin .9s .7s ease both;max-width:calc(100% - 40px);overflow-x:auto}
@keyframes pillin{from{opacity:0;transform:translate(-50%,24px)}}
.pill a,.pill span{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;padding:11px 20px;border-radius:999px;color:#fff;text-decoration:none;font-size:15px;font-weight:600;transition:background .25s,color .25s}
.pill a:hover{background:rgba(255,255,255,.12)}
.pill a.ask{background:var(--y);color:var(--k)}
.pill a.ask:hover{background:#ffd84a}
.pill span{color:rgba(255,255,255,.4);cursor:default}
.pill em{font-style:normal;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.6)}
.pill svg{flex:none}
.stripe{position:absolute;z-index:3;left:0;right:0;bottom:0;height:10px;background:repeating-linear-gradient(-45deg,var(--y) 0 16px,var(--k) 16px 32px);background-size:45px 45px;animation:slide 1.2s linear infinite}
@keyframes slide{to{background-position:45px 0}}
.pp{position:absolute;z-index:3;right:22px;bottom:30px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(17,17,17,.5);color:#fff;cursor:pointer;display:grid;place-items:center}
@media (max-width:760px){.content{padding:0 24px}.pill{bottom:28px}.pill a,.pill span{padding:10px 14px;font-size:14px}.pp{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section class="hero">
  <div class="media" id="media"></div>
  <div class="shade"></div>
  <div class="content">
    <div class="eyebrow"><i></i>CID · Barloworld Mongolia</div>
    <h1>Everything CID,<br><span>in one place.</span></h1>
    <p class="lead">Dashboards, CRM help, events and department resources for the whole division.<small>Хэлтсийн мэдээлэл, самбар, арга хэмжээ — нэг дор.</small></p>
  </div>
  <nav class="pill" id="pill"></nav>
  <button class="pp" id="pp" aria-label="Pause background">❚❚</button>
  <div class="stripe"></div>
</section>
<script>
/* ===== Your settings ===== */
const MEDIA = {
  video: "cid-hero-sample.mp4",              /* "" to use photos only */
  images: ["cid-hero-sample.png"]            /* poster + slideshow photos */
};
const LINKS = {                               /* "" shows the item as "Soon" */
  dashboards: "",
  crm: "",
  events: "",
  resources: "",
  ask: ""
};
/* ========================= */
const I={
  dashboards:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  crm:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.7.8 2.8 2.6 3 5.2"/>',
  events:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v.01M14 21h7v-4"/>',
  resources:'<path d="M4 5a2 2 0 0 1 2-2h5v18H6a2 2 0 0 1-2-2zM13 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5z"/>',
  ask:'<path d="M12 3l1.8 4.6L18.5 9l-4.7 1.4L12 15l-1.8-4.6L5.5 9l4.7-1.4z"/><path d="M19 15l.8 2 2 .8-2 .8L19 21l-.8-2-2-.8 2-.8z"/>'
};
const NAMES={dashboards:"Dashboards",crm:"CRM",events:"Events",resources:"Resources",ask:"Ask CID"};
const svg=k=>`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
document.getElementById("pill").innerHTML=Object.keys(NAMES).map(k=>LINKS[k]
  ?`<a href="${LINKS[k]}" target="_top" class="${k==="ask"?"ask":""}">${svg(k)}${NAMES[k]}</a>`
  :`<span>${svg(k)}${NAMES[k]} <em>Soon</em></span>`).join("");
const M=document.getElementById("media"),pp=document.getElementById("pp");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let vid=null,timer=null,paused=false;
if(MEDIA.video&&!reduce){
  vid=document.createElement("video");
  Object.assign(vid,{src:MEDIA.video,autoplay:true,muted:true,loop:true,playsInline:true,poster:MEDIA.images[0]||""});
  vid.setAttribute("muted","");vid.setAttribute("playsinline","");M.appendChild(vid);
}else{
  const imgs=MEDIA.images.length?MEDIA.images:[];
  imgs.forEach((src,i)=>{const d=document.createElement("div");d.className="slide"+(i===0?" on":"");d.style.backgroundImage=`url("${src}")`;M.appendChild(d)});
  const s=[...M.children];let n=0;
  if(s.length>1&&!reduce)timer=setInterval(()=>{if(paused)return;s[n].classList.remove("on");n=(n+1)%s.length;s[n].classList.add("on")},7000);
  if(s.length<2)pp.style.display="none";
}
pp.onclick=()=>{paused=!paused;pp.textContent=paused?"▶":"❚❚";pp.setAttribute("aria-label",paused?"Play background":"Pause background");if(vid)paused?vid.pause():vid.play()};
</script>
</body>
</html>
