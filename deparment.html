<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CID Departments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--y:#FFCD11;--k:#111}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;color:#fff;font-family:"Barlow","Segoe UI",system-ui,sans-serif}
.wrap{max-width:1320px;margin:0 auto;padding:8px 4px 24px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.eyebrow i{width:26px;height:4px;background:var(--y);border-radius:2px}
h2{font-size:clamp(28px,3vw,40px);font-weight:800;margin-top:8px}
.bento{display:grid;grid-template-columns:1.4fr 1fr 1fr;grid-template-rows:240px 240px;gap:16px}
.t{position:relative;overflow:hidden;border-radius:20px;border:1px solid #2e2e2e;background:#1a1a1a;padding:26px;display:flex;flex-direction:column;justify-content:flex-end;
  transition:border-color .3s,transform .3s;animation:rise .7s ease both;animation-delay:var(--d)}
.t:nth-child(1){grid-row:1/3}
.t:nth-child(2){grid-column:2/4}
.t:hover{border-color:var(--y);transform:translateY(-4px)}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .8s ease}
.t:hover .bg{transform:scale(1.06)}
.bg.pattern{background:radial-gradient(circle at 85% 15%,rgba(255,205,17,.22),transparent 45%),repeating-linear-gradient(-45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 22px),#1a1a1a}
.t::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.25) 60%,rgba(0,0,0,.05) 100%);z-index:1}
.t>*:not(.bg){position:relative;z-index:2}
.tag{display:inline-block;align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--k);background:var(--y);padding:4px 10px;border-radius:999px;margin-bottom:12px}
.t h3{font-size:clamp(22px,2.2vw,30px);font-weight:800;line-height:1.05}
.t:nth-child(1) h3{font-size:clamp(28px,3vw,42px)}
.t p{color:rgba(255,255,255,.75);font-size:15px;line-height:1.5;margin-top:8px;max-width:440px}
.t p small{display:block;color:rgba(255,255,255,.55);font-size:13px;margin-top:2px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;transform:translateY(8px);opacity:.85;transition:transform .3s,opacity .3s}
.t:hover .links{transform:none;opacity:1}
.links a{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;text-decoration:none;font-size:13px;font-weight:600;backdrop-filter:blur(6px);transition:background .2s,color .2s}
.links a:hover{background:var(--y);color:var(--k);border-color:var(--y)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@media (max-width:900px){.bento{grid-template-columns:1fr 1fr;grid-template-rows:auto}.t:nth-child(1),.t:nth-child(2){grid-row:auto;grid-column:auto}.t{min-height:220px}}
@media (max-width:560px){.bento{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><div class="eyebrow"><i></i>Our departments · Хэлтсүүд</div><h2>Four teams, one division.</h2></div></div>
  <div class="bento" id="bento"></div>
</div>
<script>
/* ===== Your departments: image "" uses the CAT pattern ===== */
const DEPTS = [
  { name:"CI Prime CAT Sales", tag:"Sales", en:"New Cat machines for construction and mining customers.", mn:"Барилга, уул уурхайн шинэ Cat техник.", image:"", files:"", reports:"" },
  { name:"Energy & Transportation", tag:"E&T", en:"Power generation, engines and rental solutions.", mn:"Цахилгаан үүсгүүр, хөдөлгүүр, түрээс.", image:"", files:"", reports:"" },
  { name:"Analytics & Support", tag:"Support", en:"Reporting, CRM and business insights for the division.", mn:"Тайлан, CRM, бизнесийн шинжилгээ.", image:"", files:"", reports:"" },
  { name:"Marketing", tag:"Marketing", en:"Campaigns, events and customer communication.", mn:"Кампанит ажил, арга хэмжээ, харилцаа.", image:"", files:"", reports:"" }
];
/* =========================================================== */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const link=(u,t)=>u?`<a href="${esc(u)}" target="_blank" rel="noopener">${t} ↗</a>`:"";
document.getElementById("bento").innerHTML=DEPTS.map((d,i)=>`
  <article class="t" style="--d:${.1+i*.1}s">
    <div class="bg${d.image?"":" pattern"}" ${d.image?`style="background-image:url('${esc(d.image)}')"`:""}></div>
    <span class="tag">${esc(d.tag)}</span>
    <h3>${esc(d.name)}</h3>
    <p>${esc(d.en)}<small>${esc(d.mn)}</small></p>
    <div class="links">${link(d.files,"Files")}${link(d.reports,"Reports")}</div>
  </article>`).join("");
</script>
</body>
</html>
